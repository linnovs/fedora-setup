- name: Enable noctalia-greeter in greetd
  become: true
  ansible.builtin.lineinfile:
    path: /etc/greetd/config.toml
    regexp: "^command\\s*="
    line: 'command = "/usr/bin/noctalia-greeter-session"'
    state: present
    backup: true
    mode: "0644"

- name: "Get current systemd default target"
  ansible.builtin.command: "systemctl get-default"
  become: true
  changed_when: false
  register: greetd_systemd_default

- name: Set default to graphical.target
  ansible.builtin.command: "systemctl set-default graphical.target"
  when: "'graphical' not in greetd_systemd_default.stdout"
  changed_when: true

- name: Enable greetd service
  become: true
  ansible.builtin.systemd_service:
    name: greetd
    enabled: true
    state: started
